[project]
name = "doc-processor"
version = "0.1.0"
description = "採購單關聯單據重組與單據明細產生器"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "pillow>=12.1.0",
    "numpy>=2.4.1",
    "opencv-python>=4.13.0.90",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_processor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
